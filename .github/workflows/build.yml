name: Android Debug Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 1

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: ''
        log-accepted-android-sdk-licenses: false

    - name: Accept licenses and install NDK/CMake
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Update BuildVars with API credentials
      env:
        TG_APP_ID: ${{ secrets.TG_APP_ID }}
        TG_APP_HASH: ${{ secrets.TG_APP_HASH }}
      run: |
        FILE=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
        sed -i "s/public static int APP_ID = .*/public static int APP_ID = ${TG_APP_ID};/" $FILE
        sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"${TG_APP_HASH}\";/" $FILE

    - name: Build Debug APK
      run: |
        touch build.log
        ./gradlew :TMessagesProj_AppStandalone:assembleDebug \
          --stacktrace --no-daemon 2>&1 | tee build.log

    - name: Extract error if build failed
      if: failure()
      run: |
        echo "=== BUILD FAILED ==="
        grep -A 20 "What went wrong" build.log || true
        grep -A 10 "FAILURE" build.log || true

    - name: Find APK files
      if: always()
      run: |
        echo "=== All APKs in repo ==="
        find . -name "*.apk" -type f -exec ls -lh {} \;
        echo "=== Standalone build outputs ==="
        find TMessagesProj_AppStandalone -path "*outputs*" -type f 2>/dev/null || true

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: telegram-debug-apk
        path: '**/build/outputs/apk/**/*.apk'

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build.log
