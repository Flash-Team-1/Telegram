name: Android Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept licenses and install NDK/CMake
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create dummy keystore
      run: |
        mkdir -p TMessagesProj/config
        rm -f TMessagesProj/config/release.keystore
        keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
          -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass android -keypass android \
          -dname "CN=Telegram Android, OU=Development, O=Telegram, L=San Francisco, ST=CA, C=US" \
          -noprompt

    - name: Update gradle.properties
      run: |
        sed -i 's/RELEASE_STORE_PASSWORD=.*/RELEASE_STORE_PASSWORD=android/' gradle.properties
        sed -i 's/RELEASE_KEY_PASSWORD=.*/RELEASE_KEY_PASSWORD=android/' gradle.properties
        sed -i 's/RELEASE_KEY_ALIAS=.*/RELEASE_KEY_ALIAS=androidkey/' gradle.properties

    - name: Update BuildVars with API credentials
      run: |
        FILE=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
        sed -i 's/public static int APP_ID = .*/public static int APP_ID = 26333172;/' $FILE
        sed -i 's/public static String APP_HASH = .*/public static String APP_HASH = "2a031a551da8ca175b0225eac8a2a131";/' $FILE

    - name: Build with Gradle
      env:
        RELEASE_STORE_PASSWORD: android
        RELEASE_KEY_PASSWORD: android
        RELEASE_KEY_ALIAS: androidkey
      run: |
        touch build.log
        ./gradlew :TMessagesProj_AppStandalone:assembleRelease \
          --stacktrace --no-daemon 2>&1 | tee build.log

    - name: Extract error if build failed
      if: failure()
      run: |
        echo "=== BUILD FAILED ==="
        grep -A 20 "What went wrong" build.log || true
        grep -A 10 "FAILURE" build.log || true

    - name: Find APK files
      if: success()
      run: find . -name "*.apk" -type f -exec ls -lh {} \;

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: telegram-apk
        path: '**/build/outputs/apk/**/*.apk'

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build.log
